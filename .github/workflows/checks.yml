name: Project checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  detection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q weapon_detection.py
      - name: Run the checked-in weights on the sample image
        run: |
          python - <<'PY'
          from pathlib import Path

          from ultralytics import YOLO

          weights = Path("models/weapon_detection_best.pt")
          image = Path("test_weapon.jpg")
          assert weights.is_file(), weights
          assert image.is_file(), image
          results = YOLO(str(weights)).predict(str(image), device="cpu", verbose=False)
          assert len(results) == 1 and results[0].boxes is not None
          PY
